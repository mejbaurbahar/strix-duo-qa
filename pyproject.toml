[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strix-duo-qa"
version = "1.0.0"
description = "Autonomous Multi-Agent DevSecOps Testing Engine powered by Strix and REA for GitLab Duo"
readme = "README.md"
authors = [{ name = "Mejbaur Bahar", email = "fagun115946@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0"
]

[project.scripts]
strix-duo = "strix_duo.cli:main"

[tool.setuptools.packages.find]
include = ["strix_duo*"]
