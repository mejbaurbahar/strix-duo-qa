stages:
  - test
  - deploy

strix_duo_qa_audit:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -e .
    - python -m unittest discover -s tests -v
    - python -m strix_duo.cli --target "https://httpbin.org" --output "gl-security-qa-report.md" || true
  artifacts:
    name: "strix-duo-qa-report"
    when: always
    paths:
      - gl-security-qa-report.md

deploy_google_cloud_run:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Deploying Strix-Duo QA microservice to Google Cloud Run"
