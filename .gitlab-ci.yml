# Strix-Duo QA: GitLab CI/CD Pipeline Configuration
# Autonomous SQA & Security Gate

stages:
  - test
  - security-qa
  - deploy

strix_duo_autonomous_qa:
  stage: security-qa
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pip install --no-cache-dir .
  script:
    - echo "Executing Autonomous Multi-Agent DevSecOps Testing..."
    - strix-duo --target "$TEST_ENVIRONMENT_URL" --mr-id "$CI_MERGE_REQUEST_IID" --output "gl-security-qa-report.md"
  artifacts:
    name: "strix-duo-qa-report"
    when: always
    paths:
      - gl-security-qa-report.md
    reports:
      codequality: gl-security-qa-report.md
